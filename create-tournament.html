<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDX ESPORTS - Create Tournament</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#020817;
  color:white;
  min-height:100vh;
  padding-bottom:30px;
}

.header{
  padding:22px 18px;
  display:flex;
  align-items:center;
  gap:15px;
}

.back{
  color:#00c8ff;
  text-decoration:none;
  font-size:25px;
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#00c8ff;
}

.title{
  padding:10px 18px 20px;
}

.title h1{
  font-size:26px;
}

.title p{
  color:#7892a8;
  font-size:13px;
  margin-top:6px;
}

.form{
  margin:0 18px;
  background:linear-gradient(145deg,#071c30,#04101e);
  border:1px solid #12364e;
  border-radius:18px;
  padding:18px;
}

label{
  display:block;
  color:#9ab0c0;
  font-size:12px;
  margin:0 0 7px;
}

input,
select{
  width:100%;
  height:45px;
  margin-bottom:16px;
  padding:0 12px;
  border-radius:9px;
  border:1px solid #163b53;
  outline:none;
  background:#061426;
  color:white;
  font-size:13px;
}

input:focus,
select:focus{
  border-color:#00c8ff;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.create{
  width:100%;
  height:46px;
  border:0;
  border-radius:10px;
  background:#00c8ff;
  color:#00111c;
  font-weight:900;
  font-size:14px;
  margin-top:5px;
}

.message{
  text-align:center;
  color:#58d68d;
  font-size:12px;
  margin-top:14px;
  min-height:16px;
}
</style>
</head>

<body>

<div class="header">
  <a href="home.html" class="back">‹</a>
  <div class="logo">TDX <span>ESPORTS</span></div>
</div>

<div class="title">
  <h1>Create Tournament</h1>
  <p>Set up a new esports tournament</p>
</div>

<div class="form">

  <label>Tournament Name</label>
  <input
    type="text"
    id="name"
    placeholder="Enter tournament name"
  >

  <label>Game</label>
  <select id="game">
    <option value="BGMI">BGMI</option>
    <option value="Free Fire">Free Fire</option>
  </select>

  <div class="row">

    <div>
      <label>Entry Fee</label>
      <input
        type="number"
        id="fee"
        placeholder="₹0"
        min="0"
      >
    </div>

    <div>
      <label>Prize Pool</label>
      <input
        type="number"
        id="prize"
        placeholder="₹0"
        min="0"
      >
    </div>

  </div>

  <div class="row">

    <div>
      <label>Date</label>
      <input
        type="date"
        id="date"
      >
    </div>

    <div>
      <label>Time</label>
      <input
        type="time"
        id="time"
      >
    </div>

  </div>

  <label>Total Slots</label>
  <input
    type="number"
    id="slots"
    placeholder="100"
    min="2"
  >

  <label>Match Type</label>
  <select id="match">
    <option value="Squad">Squad</option>
    <option value="Duo">Duo</option>
    <option value="Solo">Solo</option>
  </select>

  <button class="create" onclick="createTournament()">
    CREATE TOURNAMENT
  </button>

  <div class="message" id="message"></div>

</div>

<script>
function createTournament(){

  const name =
    document.getElementById("name").value.trim();

  const game =
    document.getElementById("game").value;

  const fee =
    document.getElementById("fee").value;

  const prize =
    document.getElementById("prize").value;

  const date =
    document.getElementById("date").value;

  const time =
    document.getElementById("time").value;

  const slots =
    document.getElementById("slots").value;

  const match =
    document.getElementById("match").value;

  const message =
    document.getElementById("message");

  if(!name || !date || !time || !slots){
    message.style.color = "#ff6b6b";
    message.textContent = "Please fill all required fields.";
    return;
  }

  const tournament = {
    name:name,
    game:game,
    fee:fee || 0,
    prize:prize || 0,
    date:date,
    time:time,
    slots:slots,
    match:match
  };

  localStorage.setItem(
    "tdx_created_tournament",
    JSON.stringify(tournament)
  );

  message.style.color = "#58d68d";
  message.textContent =
    "Tournament created successfully!";
}
</script>

</body>
</html>
