<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDX ESPORTS - Manage Results</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#061225;
  color:white;
  min-height:100vh;
}

.header{
  background:#0a1b35;
  padding:18px;
  display:flex;
  align-items:center;
  gap:15px;
  border-bottom:1px solid #12375d;
}

.back{
  font-size:25px;
  cursor:pointer;
}

.logo{
  color:#19d9ff;
  font-size:21px;
  font-weight:bold;
}

.container{
  padding:20px;
}

h1{
  font-size:25px;
  margin-bottom:5px;
}

.subtitle{
  color:#8ea5bd;
  font-size:13px;
  margin-bottom:20px;
}

.result{
  background:#0b1d36;
  border:1px solid #153b61;
  border-radius:14px;
  padding:17px;
  margin-bottom:15px;
}

.title{
  font-size:17px;
  font-weight:bold;
}

.game{
  color:#19d9ff;
  font-size:11px;
  margin-top:5px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid #173452;
}

.box span{
  display:block;
  color:#8098b0;
  font-size:10px;
  margin-bottom:4px;
}

.box b{
  font-size:14px;
}

.status{
  color:#35e6c0;
}

button{
  width:100%;
  margin-top:15px;
  padding:13px;
  border-radius:9px;
  border:1px solid #1b466d;
  background:#102943;
  color:white;
  font-weight:bold;
}

.edit{
  background:#12cde9;
  color:#00131f;
  border:none;
}

.add{
  width:100%;
  margin-bottom:18px;
  background:#12cde9;
  color:#00131f;
  border:none;
  padding:14px;
  border-radius:10px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="header">
  <div class="back" onclick="goBack()">‹</div>
  <div class="logo">TDX ESPORTS</div>
</div>

<div class="container">

<h1>Manage Results</h1>
<div class="subtitle">Update and manage tournament results</div>

<button class="add" onclick="addResult()">+ ADD RESULT</button>

<div class="result">

  <div class="title">TDX ESPORTS CHAMPIONSHIP</div>
  <div class="game">BGMI • SQUAD</div>

  <div class="row">
    <div class="box">
      <span>WINNER</span>
      <b>DOMIN ESPORTS</b>
    </div>

    <div class="box">
      <span>PRIZE</span>
      <b>₹10,000</b>
    </div>

    <div class="box">
      <span>STATUS</span>
      <b class="status">COMPLETED</b>
    </div>
  </div>

  <button class="edit" onclick="editResult('TDX ESPORTS CHAMPIONSHIP')">
    EDIT RESULT
  </button>

</div>

<div class="result">

  <div class="title">TDX NIGHT BATTLE</div>
  <div class="game">BGMI • DUO</div>

  <div class="row">
    <div class="box">
      <span>WINNER</span>
      <b>TDX WARRIORS</b>
    </div>

    <div class="box">
      <span>PRIZE</span>
      <b>₹5,000</b>
    </div>

    <div class="box">
      <span>STATUS</span>
      <b class="status">COMPLETED</b>
    </div>
  </div>

  <button class="edit" onclick="editResult('TDX NIGHT BATTLE')">
    EDIT RESULT
  </button>

</div>

</div>

<script>

function goBack(){
  window.location.href="admin.html";
}

function addResult(){
  alert("Add Result feature will be connected later.");
}

function editResult(name){
  alert("Editing result: " + name);
}

</script>

</body>
</html>
