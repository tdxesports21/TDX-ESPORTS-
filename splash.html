<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDX ESPORTS</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  width: 100%;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #020817;
  color: white;
}

.splash {
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 25px;
  background:
    radial-gradient(circle at center, #06345c 0%, #03152b 42%, #020817 80%);
  position: relative;
}

.logo-box {
  width: 145px;
  height: 145px;
  border: 2px solid #00c8ff;
  border-radius: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 0 20px #00aaff,
    inset 0 0 25px rgba(0, 200, 255, .25);
  animation: glow 2s infinite alternate;
}

.logo {
  text-align: center;
  font-weight: 900;
  letter-spacing: 2px;
  font-size: 25px;
  color: #ffffff;
  text-shadow: 0 0 15px #00c8ff;
}

.logo span {
  display: block;
  color: #00c8ff;
  font-size: 13px;
  letter-spacing: 4px;
  margin-top: 7px;
}

.title {
  margin-top: 28px;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 3px;
  text-shadow: 0 0 15px #00bfff;
}

.tagline {
  margin-top: 10px;
  color: #a8c7dc;
  font-size: 14px;
  letter-spacing: 1px;
}

.loading-area {
  position: absolute;
  bottom: 55px;
  width: min(330px, 80%);
  text-align: center;
}

.loading-text {
  font-size: 12px;
  color: #8faabd;
  margin-bottom: 10px;
}

.bar {
  height: 5px;
  width: 100%;
  background: #10263b;
  border-radius: 10px;
  overflow: hidden;
}

.progress {
  height: 100%;
  width: 0%;
  background: #00c8ff;
  box-shadow: 0 0 12px #00c8ff;
  animation: load 3s linear forwards;
}

@keyframes load {
  from { width: 0%; }
  to { width: 100%; }
}

@keyframes glow {
  from {
    box-shadow: 0 0 15px #008dcc,
                inset 0 0 15px rgba(0,200,255,.15);
  }
  to {
    box-shadow: 0 0 35px #00c8ff,
                inset 0 0 30px rgba(0,200,255,.3);
  }
}
</style>
</head>

<body>

<div class="splash">

  <div class="logo-box">
    <div class="logo">
      TDX
      <span>ESPORTS</span>
    </div>
  </div>

  <div class="title">TDX ESPORTS</div>

  <div class="tagline">
    PLAY. COMPETE. CONQUER.
  </div>

  <div class="loading-area">
    <div class="loading-text">Loading...</div>
    <div class="bar">
      <div class="progress"></div>
    </div>
  </div>

</div>

  <script>
setTimeout(() => {
  document.body.innerHTML = `
    <div style="
      width:100%;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#020817;
      color:#00c8ff;
      font-family:Arial,sans-serif;
      font-size:18px;
    ">
      Loading TDX ESPORTS...
    </div>
  `;

  setTimeout(() => {
    window.location.replace("login.html");
  }, 100);
}, 3000);
  </script>


</body>
</html>
