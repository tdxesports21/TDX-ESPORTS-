<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Manage Match Room</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#050b18;
 color:white;
 font-family:Arial,sans-serif;
}

.header{
 padding:20px;
 border-bottom:1px solid #173653;
}

.logo{
 color:#00d9ff;
 font-size:24px;
 font-weight:900;
}

.container{
 padding:20px;
}

.card{
 background:#0b1628;
 border:1px solid #173653;
 border-radius:18px;
 padding:20px;
 margin-bottom:18px;
}

h1{
 margin:0 0 7px;
 font-size:23px;
}

.sub{
 color:#8da5bd;
 font-size:13px;
 margin-bottom:22px;
}

label{
 display:block;
 color:#9db2c9;
 font-size:13px;
 margin:15px 0 7px;
}

input{
 width:100%;
 padding:14px;
 border-radius:10px;
 border:1px solid #234665;
 background:#07101f;
 color:white;
 outline:none;
}

input:focus{
 border-color:#00d9ff;
}

button{
 width:100%;
 padding:15px;
 margin-top:18px;
 border:0;
 border-radius:11px;
 background:#00d9ff;
 color:#001018;
 font-size:15px;
 font-weight:900;
}

.preview{
 margin-top:20px;
 padding:15px;
 background:#07101f;
 border-radius:12px;
}

.row{
 display:flex;
 justify-content:space-between;
 padding:10px 0;
 border-bottom:1px solid #17304a;
}

.row:last-child{
 border-bottom:0;
}

.value{
 color:#00d9ff;
 font-weight:800;
}

.back{
 display:block;
 text-align:center;
 color:#00d9ff;
 text-decoration:none;
 margin-top:20px;
}
</style>
</head>

<body>

<div class="header">
 <div class="logo">TDX ESPORTS</div>
</div>

<div class="container">

<div class="card">

<h1>MANAGE MATCH ROOM</h1>

<div class="sub">
Admin can update the room details for the tournament.
</div>

<label>Room ID</label>
<input
 id="roomId"
 type="text"
 placeholder="Enter Room ID">

<label>Room Password</label>
<input
 id="roomPassword"
 type="text"
 placeholder="Enter Room Password">

<button onclick="saveRoom()">
UPDATE ROOM
</button>

</div>

<div class="card">

<h1>ROOM PREVIEW</h1>

<div class="preview">

<div class="row">
<span>Room ID</span>
<span class="value" id="previewId">12345678</span>
</div>

<div class="row">
<span>Password</span>
<span class="value" id="previewPassword">TDX2026</span>
</div>

</div>

</div>

<a class="back" href="admin.html">
← Back to Admin
</a>

</div>

<script>

const savedId =
 localStorage.getItem("tdx_room_id");

const savedPassword =
 localStorage.getItem("tdx_room_password");

if(savedId){
 document.getElementById("roomId").value=savedId;
 document.getElementById("previewId").innerText=savedId;
}

if(savedPassword){
 document.getElementById("roomPassword").value=savedPassword;
 document.getElementById("previewPassword").innerText=savedPassword;
}

function saveRoom(){

 const id =
 document.getElementById("roomId").value.trim();

 const password =
 document.getElementById("roomPassword").value.trim();

 if(!id || !password){
   alert("Please enter Room ID and Password.");
   return;
 }

 localStorage.setItem("tdx_room_id",id);
 localStorage.setItem("tdx_room_password",password);

 document.getElementById("previewId").innerText=id;
 document.getElementById("previewPassword").innerText=password;

 alert("Match Room updated successfully!");
}

</script>

</body>
</html>
