<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDX ESPORTS - Tournament Details</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#020817;
  color:white;
  min-height:100vh;
  padding-bottom:30px;
}

.header{
  padding:20px 18px;
  display:flex;
  align-items:center;
  gap:15px;
}

.back{
  color:#00c8ff;
  text-decoration:none;
  font-size:28px;
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#00c8ff;
}

.hero{
  margin:5px 18px 18px;
  padding:22px 18px;
  background:linear-gradient(145deg,#07304d,#04101e);
  border:1px solid #00c8ff;
  border-radius:20px;
  box-shadow:0 0 20px rgba(0,200,255,.12);
}

.game{
  color:#00c8ff;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
}

.hero h1{
  font-size:25px;
  margin-top:10px;
}

.status{
  display:inline-block;
  margin-top:10px;
  padding:6px 10px;
  border-radius:10px;
  background:rgba(0,200,255,.12);
  color:#00c8ff;
  font-size:10px;
  font-weight:bold;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.info{
  background:#061426;
  border-radius:11px;
  padding:13px;
}

.info small{
  display:block;
  color:#71899c;
  font-size:10px;
  margin-bottom:5px;
}

.info b{
  font-size:14px;
}

.section{
  margin:0 18px 18px;
  padding:18px;
  background:#061426;
  border:1px solid #123249;
  border-radius:17px;
}

.section h2{
  font-size:16px;
  margin-bottom:14px;
}

.detail{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #102a3e;
  font-size:12px;
}

.detail:last-child{
  border-bottom:0;
}

.detail span{
  color:#71899c;
}

.join{
  width:100%;
  height:48px;
  border:0;
  border-radius:10px;
  background:#00c8ff;
  color:#00111c;
  font-weight:900;
  font-size:14px;
}

.note{
  text-align:center;
  color:#71899c;
  font-size:10px;
  margin-top:10px;
}

.message{
  text-align:center;
  color:#58d68d;
  font-size:12px;
  margin-top:12px;
  min-height:16px;
}
</style>
</head>

<body>

<div class="header">
  <a href="tournaments.html" class="back">‹</a>
  <div class="logo">TDX <span>ESPORTS</span></div>
</div>

<div class="hero">

  <div class="game">BGMI</div>

  <h1>TDX ESPORTS CHAMPIONSHIP</h1>

  <div class="status">UPCOMING</div>

  <div class="info-grid">

    <div class="info">
      <small>ENTRY FEE</small>
      <b>₹50</b>
    </div>

    <div class="info">
      <small>PRIZE POOL</small>
      <b>₹5,000</b>
    </div>

    <div class="info">
      <small>DATE</small>
      <b>20 SEP 2026</b>
    </div>

    <div class="info">
      <small>TIME</small>
      <b>08:00 PM</b>
    </div>

  </div>

</div>

<div class="section">

  <h2>Tournament Details</h2>

  <div class="detail">
    <span>Game</span>
    <b>BGMI</b>
  </div>

  <div class="detail">
    <span>Match Type</span>
    <b>Squad</b>
  </div>

  <div class="detail">
    <span>Total Slots</span>
    <b>100</b>
  </div>

  <div class="detail">
    <span>Available Slots</span>
    <b>75</b>
  </div>

  <div class="detail">
    <span>Entry Fee</span>
    <b>₹50</b>
  </div>

  <div class="detail">
    <span>Prize Pool</span>
    <b>₹5,000</b>
  </div>

</div>

<div class="section">

  <h2>Join Tournament</h2>

  <button class="join" onclick="joinTournament()">
    JOIN TOURNAMENT
  </button>

  <div class="message" id="message"></div>

  <div class="note">
    By joining, you agree to the tournament rules.
  </div>

</div>

<script>
function joinTournament(){

  localStorage.setItem(
    "tdx_joined_tournament",
    "TDX ESPORTS CHAMPIONSHIP"
  );

  document.getElementById("message").textContent =
    "Tournament joined successfully!";
}
</script>

</body>
</html>
