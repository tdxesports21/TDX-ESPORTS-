<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDX ESPORTS - Manage Admins</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#061225;
  color:white;
  min-height:100vh;
}

.header{
  background:#0a1b35;
  padding:18px;
  display:flex;
  align-items:center;
  gap:15px;
  border-bottom:1px solid #12375d;
}

.back{
  font-size:25px;
  cursor:pointer;
}

.logo{
  color:#19d9ff;
  font-size:21px;
  font-weight:bold;
}

.container{
  padding:20px;
}

h1{
  font-size:25px;
  margin-bottom:5px;
}

.subtitle{
  color:#8ea5bd;
  font-size:13px;
  margin-bottom:20px;
}

.add{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#12cde9;
  color:#00131f;
  font-weight:bold;
  margin-bottom:18px;
}

.admin-card{
  background:#0b1d36;
  border:1px solid #153b61;
  border-radius:14px;
  padding:17px;
  margin-bottom:14px;
}

.top{
  display:flex;
  align-items:center;
  gap:13px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#12304f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.name{
  font-size:17px;
  font-weight:bold;
}

.email{
  color:#8198b0;
  font-size:11px;
  margin-top:4px;
}

.badge{
  margin-left:auto;
  color:#35e6c0;
  background:#103c38;
  padding:6px 8px;
  border-radius:7px;
  font-size:9px;
}

.role{
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid #173452;
  color:#8ea5bd;
  font-size:12px;
}

.role b{
  color:#19d9ff;
}

.buttons{
  display:flex;
  gap:8px;
  margin-top:14px;
}

button.small{
  flex:1;
  padding:10px;
  border-radius:8px;
  border:1px solid #1b466d;
  background:#102943;
  color:white;
  font-weight:bold;
  font-size:11px;
}

button.delete{
  background:#321d29;
  border-color:#633143;
  color:#ff7f9d;
}
</style>
</head>

<body>

<div class="header">
  <div class="back" onclick="goBack()">‹</div>
  <div class="logo">TDX ESPORTS</div>
</div>

<div class="container">

<h1>Manage Admins</h1>
<div class="subtitle">Manage administrator accounts</div>

<button class="add" onclick="addAdmin()">+ ADD NEW ADMIN</button>

<div class="admin-card">

  <div class="top">
    <div class="avatar">👑</div>

    <div>
      <div class="name">TDX Admin</div>
      <div class="email">admin@tdxesports.com</div>
    </div>

    <div class="badge">ACTIVE</div>
  </div>

  <div class="role">
    Role: <b>SUPER ADMIN</b>
  </div>

  <div class="buttons">
    <button class="small" onclick="editAdmin('TDX Admin')">
      EDIT
    </button>

    <button class="small delete" onclick="deleteAdmin('TDX Admin')">
      DELETE
    </button>
  </div>

</div>

<div class="admin-card">

  <div class="top">
    <div class="avatar">🛡️</div>

    <div>
      <div class="name">Tournament Admin</div>
      <div class="email">tournament@tdxesports.com</div>
    </div>

    <div class="badge">ACTIVE</div>
  </div>

  <div class="role">
    Role: <b>ADMIN</b>
  </div>

  <div class="buttons">
    <button class="small" onclick="editAdmin('Tournament Admin')">
      EDIT
    </button>

    <button class="small delete" onclick="deleteAdmin('Tournament Admin')">
      DELETE
    </button>
  </div>

</div>

</div>

<script>

function goBack(){
  window.location.href="admin.html";
}

function addAdmin(){
  alert("Add Admin feature will be connected later.");
}

function editAdmin(name){
  alert("Edit admin: " + name);
}

function deleteAdmin(name){
  if(confirm("Delete " + name + "?")){
    alert("Admin deleted.");
  }
}

</script>

</body>
</html>
