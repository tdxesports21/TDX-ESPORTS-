<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDX ESPORTS - Profile</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#020817;
  color:#fff;
}

.app{
  min-height:100vh;
  padding-bottom:85px;
  background:radial-gradient(circle at 50% 0%,#07385f,#020817 65%);
}

.header{
  height:65px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #12364e;
}

.brand{
  font-size:21px;
  font-weight:900;
  letter-spacing:1.5px;
}

.brand span{color:#00c8ff}

.settings{
  color:#7895a8;
  font-size:21px;
}

/* PROFILE */

.profile{
  text-align:center;
  padding:25px 18px 20px;
}

.avatar{
  width:92px;
  height:92px;
  margin:auto;
  border-radius:50%;
  border:3px solid #00c8ff;
  background:#08243a;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  box-shadow:0 0 25px rgba(0,200,255,.2);
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.avatar span{
  font-size:38px;
}

.profile h1{
  font-size:22px;
  margin-top:13px;
}

.uid{
  color:#7895a8;
  font-size:11px;
  margin-top:6px;
}

.edit{
  margin-top:13px;
  padding:9px 20px;
  border-radius:20px;
  border:1px solid #00c8ff;
  background:transparent;
  color:#00c8ff;
  font-size:11px;
  font-weight:bold;
}

/* STATS */

.stats{
  margin:0 18px 18px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.stat{
  padding:16px 7px;
  text-align:center;
  border:1px solid #153b53;
  border-radius:14px;
  background:#061525;
}

.stat strong{
  display:block;
  color:#00c8ff;
  font-size:20px;
  margin-bottom:5px;
}

.stat span{
  color:#718da0;
  font-size:9px;
}

/* MENU */

.section{
  margin:0 18px 18px;
}

.section h2{
  font-size:16px;
  margin-bottom:11px;
}

.menu{
  border:1px solid #153b53;
  border-radius:15px;
  overflow:hidden;
  background:#061525;
}

.item{
  min-height:58px;
  padding:0 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #102d40;
  cursor:pointer;
}

.item:last-child{
  border-bottom:0;
}

.left{
  display:flex;
  align-items:center;
  gap:12px;
}

.icon{
  font-size:19px;
}

.item strong{
  display:block;
  font-size:12px;
}

.item small{
  display:block;
  color:#637e91;
  font-size:9px;
  margin-top:3px;
}

.arrow{
  color:#557286;
  font-size:18px;
}

/* LOGOUT */

.logout{
  width:100%;
  padding:13px;
  border:1px solid #3b2630;
  border-radius:11px;
  background:#160d13;
  color:#ff7185;
  font-weight:bold;
}

/* NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:rgba(3,14,27,.98);
  border-top:1px solid #16384f;
  z-index:100;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  color:#668195;
  font-size:10px;
  cursor:pointer;
}

.nav-icon{
  font-size:20px;
}

.nav-item.active{
  color:#00c8ff;
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="brand">
    TDX <span>ESPORTS</span>
  </div>

  <div class="settings">⚙</div>

</header>


<section class="profile">

  <div class="avatar">

    <span id="avatarText">👤</span>

    <img id="avatarImg"
         style="display:none;">

  </div>

  <h1 id="playerName">
    TDX PLAYER
  </h1>

  <div class="uid">
    TDX PLAYER
  </div>

  <button class="edit"
          onclick="editProfile()">
    EDIT PROFILE
  </button>

</section>


<section class="stats">

  <div class="stat">
    <strong>0</strong>
    <span>MATCHES</span>
  </div>

  <div class="stat">
    <strong>0</strong>
    <span>WINS</span>
  </div>

  <div class="stat">
    <strong>0</strong>
    <span>KILLS</span>
  </div>

</section>


<section class="section">

  <h2>Account</h2>

  <div class="menu">

    <div class="item"
         onclick="connectBGMI()">

      <div class="left">
        <div class="icon">🎮</div>

        <div>
          <strong>CONNECT BGMI ID</strong>
          <small>Connect your BGMI player account</small>
        </div>
      </div>

      <div class="arrow">›</div>

    </div>


    <div class="item"
         onclick="location.href='team.html'">

      <div class="left">
        <div class="icon">👥</div>

        <div>
          <strong>MY TEAM</strong>
          <small>View and manage your squad</small>
        </div>
      </div>

      <div class="arrow">›</div>

    </div>


    <div class="item"
         onclick="location.href='leaderboard.html'">

      <div class="left">
        <div class="icon">🏆</div>

        <div>
          <strong>MY RANKING</strong>
          <small>View leaderboard position</small>
        </div>
      </div>

      <div class="arrow">›</div>

    </div>

  </div>

</section>


<section class="section">

  <button class="logout"
          onclick="logout()">
    LOG OUT
  </button>

</section>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <div class="nav-item"
       onclick="location.href='home.html'">
    <div class="nav-icon">⌂</div>
    <div>Home</div>
  </div>

  <div class="nav-item"
       onclick="location.href='tournaments.html'">
    <div class="nav-icon">🏆</div>
    <div>Tournaments</div>
  </div>

  <div class="nav-item"
       onclick="location.href='results.html'">
    <div class="nav-icon">📋</div>
    <div>Results</div>
  </div>

  <div class="nav-item active">
    <div class="nav-icon">👤</div>
    <div>Profile</div>
  </div>

</nav>


<script>

/* LOAD NAME */

const savedName =
  localStorage.getItem("tdx_player_name");

if(savedName){
  document.getElementById("playerName").textContent =
    savedName;
}


/* LOAD DP */

const savedDP =
  localStorage.getItem("tdx_player_dp");

if(savedDP){

  const img =
    document.getElementById("avatarImg");

  img.src = savedDP;
  img.style.display = "block";

  document.getElementById("avatarText").style.display =
    "none";
}


/* EDIT PROFILE */

function editProfile(){

  const oldName =
    localStorage.getItem("tdx_player_name") ||
    "TDX PLAYER";

  const newName =
    prompt("Enter your player name:",oldName);

  if(newName && newName.trim()){

    localStorage.setItem(
      "tdx_player_name",
      newName.trim()
    );

    document.getElementById("playerName").textContent =
      newName.trim();

  }

}


/* BGMI */

function connectBGMI(){

  const id =
    prompt("Enter your BGMI ID / UID:");

  if(id && id.trim()){

    localStorage.setItem(
      "tdx_bgmi_id",
      id.trim()
    );

    alert("BGMI ID saved successfully!");

  }

}


/* LOGOUT */

function logout(){

  localStorage.removeItem("tdx_logged_in");

  location.href="login.html";

}

</script>

</body>
</html>
