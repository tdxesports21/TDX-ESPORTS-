<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDX ESPORTS - Join Team</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#020817;
  color:white;
}

.app{
  min-height:100vh;
  padding-bottom:30px;
  background:radial-gradient(circle at 50% 0%,#07385f,#020817 65%);
}

.header{
  height:65px;
  padding:0 18px;
  display:flex;
  align-items:center;
  gap:15px;
  border-bottom:1px solid #12364e;
}

.back{
  color:#00c8ff;
  font-size:27px;
  cursor:pointer;
}

.brand{
  font-size:20px;
  font-weight:900;
  letter-spacing:1.5px;
}

.brand span{color:#00c8ff}

.content{
  padding:22px 18px;
}

.content h1{
  font-size:25px;
  margin-bottom:7px;
}

.subtitle{
  color:#7895a8;
  font-size:12px;
  margin-bottom:24px;
}

.tournament{
  padding:16px;
  border:1px solid #17506e;
  border-radius:15px;
  background:#061a2b;
  margin-bottom:20px;
}

.tournament small{
  color:#00c8ff;
  font-size:10px;
}

.tournament h2{
  font-size:17px;
  margin-top:7px;
}

.form-box{
  padding:18px;
  border:1px solid #153b53;
  border-radius:17px;
  background:#061525;
}

label{
  display:block;
  color:#8ca7b8;
  font-size:11px;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:13px;
  margin-bottom:16px;
  border-radius:10px;
  border:1px solid #214a63;
  background:#020d1b;
  color:white;
  outline:none;
}

input:focus{
  border-color:#00c8ff;
}

.submit{
  width:100%;
  padding:14px;
  border:0;
  border-radius:11px;
  background:#00bce9;
  color:#00131e;
  font-weight:900;
  font-size:13px;
}

.note{
  text-align:center;
  color:#617d90;
  font-size:10px;
  margin-top:13px;
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="back" onclick="history.back()">‹</div>

  <div class="brand">
    TDX <span>ESPORTS</span>
  </div>

</header>


<div class="content">

  <h1>Join Team</h1>

  <p class="subtitle">
    Enter your details to join the tournament.
  </p>


  <div class="tournament">

    <small>SELECTED TOURNAMENT</small>

    <h2 id="tournamentName">
      TDX CHAMPIONSHIP S1
    </h2>

  </div>


  <div class="form-box">

    <label>PLAYER NAME</label>

    <input
      type="text"
      id="playerName"
      placeholder="Enter player name"
    >


    <label>BGMI ID / UID</label>

    <input
      type="text"
      id="bgmiId"
      placeholder="Enter BGMI ID"
    >


    <label>TEAM NAME</label>

    <input
      type="text"
      id="teamName"
      placeholder="Enter team name"
    >


    <button
      class="submit"
      onclick="submitJoin()">
      JOIN TEAM
    </button>

    <div class="note">
      Make sure your BGMI ID is correct.
    </div>

  </div>

</div>

</div>


<script>

const selected =
  localStorage.getItem("tdx_selected_tournament");

if(selected){
  document.getElementById("tournamentName").textContent =
    selected;
}


/* JOIN */

function submitJoin(){

  const player =
    document.getElementById("playerName").value.trim();

  const bgmi =
    document.getElementById("bgmiId").value.trim();

  const team =
    document.getElementById("teamName").value.trim();

  if(!player || !bgmi || !team){

    alert("Please fill all details.");

    return;
  }


  localStorage.setItem(
    "tdx_join_data",
    JSON.stringify({
      tournament:
        document.getElementById("tournamentName").textContent,
      player:player,
      bgmi:bgmi,
      team:team
    })
  );


  alert("Team joined successfully!");

  window.location.href =
    "leaderboard.html";

}

</script>

</body>
</html>
