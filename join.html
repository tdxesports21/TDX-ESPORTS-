<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Team - TDX ESPORTS</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#050b18;
 color:#fff;
 font-family:Arial,sans-serif;
}
.header{
 padding:22px 20px;
 border-bottom:1px solid #12304d;
}
.logo{
 color:#00d9ff;
 font-size:25px;
 font-weight:900;
}
.container{padding:20px}
.card{
 background:#0b1628;
 border:1px solid #123653;
 border-radius:18px;
 padding:20px;
}
h1{font-size:24px;margin:0 0 8px}
.sub{color:#8ea4bd;margin-bottom:22px}

label{
 display:block;
 color:#9db2c9;
 font-size:13px;
 margin:16px 0 7px;
}
input{
 width:100%;
 padding:14px;
 border-radius:10px;
 border:1px solid #234665;
 background:#07101f;
 color:white;
 outline:none;
}
input:focus{border-color:#00d9ff}

button{
 width:100%;
 margin-top:22px;
 padding:15px;
 border:0;
 border-radius:12px;
 background:#00d9ff;
 color:#001018;
 font-size:16px;
 font-weight:800;
}
.back{
 display:block;
 text-align:center;
 margin-top:18px;
 color:#00d9ff;
 text-decoration:none;
}
.note{
 margin-top:18px;
 padding:12px;
 background:#07101f;
 border-radius:10px;
 color:#8198b0;
 font-size:12px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">TDX ESPORTS</div>
</div>

<div class="container">

<div class="card">

<h1>Join Tournament</h1>
<div class="sub">Enter your BGMI & team details</div>

<label>Player Name</label>
<input id="playerName" type="text" placeholder="Enter player name">

<label>BGMI ID / UID</label>
<input id="bgmiId" type="text" placeholder="Enter BGMI ID">

<label>Team Name</label>
<input id="teamName" type="text" placeholder="Enter team name">

<button onclick="joinTournament()">JOIN TEAM</button>

<div class="note">
Make sure your BGMI ID and team details are correct before joining.
</div>

<a class="back" href="tournament-details.html">← Back to Tournament</a>

</div>
</div>

<script>

function joinTournament(){

 const playerName=document.getElementById("playerName").value.trim();
 const bgmiId=document.getElementById("bgmiId").value.trim();
 const teamName=document.getElementById("teamName").value.trim();

 if(!playerName || !bgmiId || !teamName){
   alert("Please fill all details.");
   return;
 }

 localStorage.setItem("tdx_join_data",JSON.stringify({
   playerName:playerName,
   bgmiId:bgmiId,
   teamName:teamName
 }));

 localStorage.setItem("tdx_joined_tournament","true");

 alert("Team joined successfully!");

 // Next screen
 window.location.href="match-room.html";
}

</script>

</body>
</html>
