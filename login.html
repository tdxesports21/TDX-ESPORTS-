<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDX ESPORTS - Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#020817;
  color:#fff;
}

.login{
  min-height:100vh;
  padding:35px 22px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 10%,#073c67 0%,#03182d 40%,#020817 82%);
}

.logo{
  font-size:38px;
  font-weight:900;
  letter-spacing:4px;
  text-shadow:0 0 18px #00c8ff;
}

.logo span{
  display:block;
  text-align:center;
  color:#00c8ff;
  font-size:12px;
  letter-spacing:6px;
  margin-top:5px;
}

.subtitle{
  margin-top:28px;
  color:#9bb6ca;
  font-size:14px;
  text-align:center;
}

.card{
  width:100%;
  max-width:390px;
  margin-top:24px;
}

.input{
  width:100%;
  padding:16px;
  margin-bottom:13px;
  border:1px solid #173a55;
  border-radius:12px;
  outline:none;
  background:#071827;
  color:#fff;
  font-size:15px;
}

.input:focus{
  border-color:#00c8ff;
  box-shadow:0 0 10px rgba(0,200,255,.15);
}

.login-btn{
  width:100%;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#00bce9;
  color:#00111b;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 0 18px rgba(0,200,255,.35);
}

.login-btn:disabled{
  opacity:.6;
}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:22px 0;
  color:#6e8799;
  font-size:12px;
  white-space:nowrap;
}

.line{
  height:1px;
  flex:1;
  background:#173a55;
}

.google-btn{
  width:100%;
  padding:15px;
  border:1px solid #21445e;
  border-radius:12px;
  background:#081a2b;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.google-btn:disabled{
  opacity:.6;
}

.google-icon{
  margin-right:10px;
  font-size:18px;
}

.switch{
  margin-top:22px;
  text-align:center;
  color:#8faabd;
  font-size:13px;
}

.switch span{
  color:#00c8ff;
  font-weight:700;
  cursor:pointer;
}

.status{
  min-height:20px;
  margin-top:14px;
  text-align:center;
  color:#00c8ff;
  font-size:12px;
  line-height:18px;
  word-break:break-word;
}

.footer{
  position:fixed;
  bottom:18px;
  color:#526d80;
  font-size:11px;
  letter-spacing:1px;
}
</style>
</head>

<body>

<div class="login">

  <div class="logo">
    TDX
    <span>ESPORTS</span>
  </div>

  <div class="subtitle" id="subtitle">
    Login to continue
  </div>

  <div class="card">

    <input
      id="email"
      class="input"
      type="email"
      placeholder="Email address"
      autocomplete="email"
      autocapitalize="none"
      spellcheck="false"
    >

    <input
      id="password"
      class="input"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
      autocapitalize="none"
      spellcheck="false"
    >

    <button class="login-btn" id="loginBtn">
      LOGIN
    </button>

    <div class="divider">
      <div class="line"></div>
      OR CONTINUE WITH
      <div class="line"></div>
    </div>

    <button class="google-btn" id="googleLoginBtn">
      <span class="google-icon">G</span>
      Continue with Google
    </button>

    <div class="switch">
      Don't have an account?
      <span id="signupBtn">SIGN UP</span>
    </div>

    <div class="status" id="status"></div>

  </div>

  <div class="footer">
    TDX ESPORTS
  </div>

</div>

<script>

const email = document.getElementById("email");
const password = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const googleBtn = document.getElementById("googleLoginBtn");
const signupBtn = document.getElementById("signupBtn");
const status = document.getElementById("status");
const subtitle = document.getElementById("subtitle");

let signupMode = false;


/* =========================
   FIREBASE AUTH PLUGIN
========================= */

function getFirebaseAuth(){

  try{

    if(
      window.Capacitor &&
      window.Capacitor.Plugins &&
      window.Capacitor.Plugins.FirebaseAuthentication
    ){

      return window.Capacitor
        .Plugins
        .FirebaseAuthentication;

    }

  }catch(error){

    console.error(
      "Plugin error:",
      error
    );

  }

  return null;
}


/* =========================
   SAVE USER
========================= */

function saveUser(user){

  if(!user){
    return;
  }

  localStorage.setItem(
    "tdx_logged_in",
    "true"
  );

  localStorage.setItem(
    "tdx_player_name",
    user.displayName || "TDX PLAYER"
  );

  localStorage.setItem(
    "tdx_player_email",
    user.email || ""
  );

  localStorage.setItem(
    "tdx_player_uid",
    user.uid || ""
  );

  if(user.photoUrl){

    localStorage.setItem(
      "tdx_player_dp",
      user.photoUrl
    );

  }

  if(user.photoURL){

    localStorage.setItem(
      "tdx_player_dp",
      user.photoURL
    );

  }

}


/* =========================
   HOME
========================= */

function goHome(){

  window.location.replace(
    "home.html"
  );

}


/* =========================
   SHOW EXACT ERROR
========================= */

function showExactError(error){

  console.error(
    "========== FIREBASE ERROR =========="
  );

  console.error(error);

  console.error(
    "===================================="
  );

  let code = "";
  let message = "";

  if(error){

    if(error.code){
      code = String(error.code);
    }

    if(error.message){
      message = String(error.message);
    }

  }

  if(!code && !message){

    status.textContent =
      "Firebase error: Unknown error";

    return;

  }

  if(code){

    status.textContent =
      code + " : " + message;

  }else{

    status.textContent =
      message;

  }

}


/* =========================
   SIMPLE ERROR MESSAGE
========================= */

function errorMessage(error){

  const code =
    error && error.code
      ? String(error.code)
      : "";

  if(code.includes("email-already-in-use")){
    return "This email is already registered.";
  }

  if(code.includes("invalid-email")){
    return "Invalid email address.";
  }

  if(code.includes("weak-password")){
    return "Password must be at least 6 characters.";
  }

  if(
    code.includes("wrong-password") ||
    code.includes("invalid-credential")
  ){
    return "Invalid email or password.";
  }

  if(code.includes("user-not-found")){
    return "Account not found.";
  }

  if(code.includes("too-many-requests")){
    return "Too many attempts. Try again later.";
  }

  if(code.includes("operation-not-allowed")){
    return "Email/Password authentication is disabled in Firebase.";
  }

  if(code.includes("network-request-failed")){
    return "Network error. Check your internet connection.";
  }

  if(code.includes("app-not-authorized")){
    return "This Android app is not authorized in Firebase.";
  }

  return "Authentication failed.";
}


/* =========================
   EMAIL LOGIN / SIGNUP
========================= */

loginBtn.addEventListener(
  "click",
  async function(){

    const e =
      email.value.trim();

    const p =
      password.value;

    status.textContent = "";

    if(!e){

      status.textContent =
        "Please enter your email.";

      return;

    }

    if(!p){

      status.textContent =
        "Please enter your password.";

      return;

    }

    if(p.length < 6){

      status.textContent =
        "Password must be at least 6 characters.";

      return;

    }

    const auth =
      getFirebaseAuth();

    if(!auth){

      status.textContent =
        "Firebase Authentication plugin is not connected.";

      console.error(
        "FirebaseAuthentication plugin not found."
      );

      return;

    }

    loginBtn.disabled = true;
    googleBtn.disabled = true;

    try{

      let result;

      /* SIGN UP */

      if(signupMode){

        status.textContent =
          "Creating account...";

        result =
          await auth.createUserWithEmailAndPassword({
            email: e,
            password: p
          });

      }

      /* LOGIN */

      else{

        status.textContent =
          "Logging in...";

        result =
          await auth.signInWithEmailAndPassword({
            email: e,
            password: p
          });

      }


      console.log(
        "Firebase result:",
        result
      );


      const user =
        result && result.user
          ? result.user
          : null;


      if(!user){

        throw new Error(
          "Firebase login succeeded but user data was not received."
        );

      }


      saveUser(user);


      status.textContent =
        signupMode
          ? "Account created successfully."
          : "Login successful.";


      setTimeout(
        goHome,
        500
      );


    }catch(error){

      /* EXACT ERROR FOR TESTING */

      showExactError(error);

      /* ALSO LOG SIMPLE MESSAGE */

      console.log(
        errorMessage(error)
      );

    }finally{

      loginBtn.disabled = false;
      googleBtn.disabled = false;

    }

  }
);


/* =========================
   LOGIN / SIGNUP SWITCH
========================= */

signupBtn.addEventListener(
  "click",
  function(){

    signupMode =
      !signupMode;


    if(signupMode){

      loginBtn.textContent =
        "CREATE ACCOUNT";

      subtitle.textContent =
        "Create your TDX ESPORTS account";

      signupBtn.textContent =
        "LOGIN";

      password.setAttribute(
        "autocomplete",
        "new-password"
      );

    }

    else{

      loginBtn.textContent =
        "LOGIN";

      subtitle.textContent =
        "Login to continue";

      signupBtn.textContent =
        "SIGN UP";

      password.setAttribute(
        "autocomplete",
        "current-password"
      );

    }


    status.textContent = "";

  }
);


/* =========================
   GOOGLE LOGIN
========================= */

googleBtn.addEventListener(
  "click",
  async function(){

    const auth =
      getFirebaseAuth();

    if(!auth){

      status.textContent =
        "Firebase Authentication plugin is not connected.";

      return;

    }


    googleBtn.disabled = true;
    loginBtn.disabled = true;


    status.textContent =
      "Opening Google Login...";


    try{

      const result =
        await auth.signInWithGoogle();


      console.log(
        "Google result:",
        result
      );


      const user =
        result && result.user
          ? result.user
          : null;


      if(!user){

        throw new Error(
          "Google user information was not received."
        );

      }


      saveUser(user);


      status.textContent =
        "Google Login successful.";


      setTimeout(
        goHome,
        500
      );


    }catch(error){

      console.error(
        "Google Firebase error:",
        error
      );

      let code =
        error && error.code
          ? String(error.code)
          : "";

      let message =
        error && error.message
          ? String(error.message)
          : "Unknown error";


      status.textContent =
        "Google: " +
        code +
        " : " +
        message;


    }finally{

      googleBtn.disabled = false;
      loginBtn.disabled = false;

    }

  }
);

</script>

</body>
</html>
