name: Build TDX ESPORTS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@8.5.1 @capacitor/cli@8.5.1 @capacitor/android@8.5.1
          npm install @capacitor-firebase/authentication@8.5.1 firebase

      - name: Prepare web files
        run: |
          mkdir -p www
          cp *.html www/

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.tdx.esports",
            "appName": "TDX ESPORTS",
            "webDir": "www",
            "plugins": {
              "FirebaseAuthentication": {
                "providers": ["google.com"]
              }
            }
          }
          EOF

      - name: Add Android
        run: |
          npx cap add android

      - name: Add Firebase config
        run: |
          if [ -f "google-services (1).json" ]; then
            cp "google-services (1).json" android/app/google-services.json
          elif [ -f "google-services.json" ]; then
            cp "google-services.json" android/app/google-services.json
          else
            echo "google-services.json not found"
            exit 1
          fi

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TDX-ESPORTS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
