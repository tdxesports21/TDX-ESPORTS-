name: Build TDX ESPORTS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "tdx-esports",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo build"
            },
            "dependencies": {
              "@capacitor/core": "8.5.1",
              "@capacitor/android": "8.5.1",
              "@capacitor-firebase/authentication": "8.5.1",
              "firebase": "12.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "8.5.1"
            }
          }
          EOF

      - name: Install packages
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp *.html www/
          echo "Web files:"
          ls -la www

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.tdx.esports",
            "appName": "TDX ESPORTS",
            "webDir": "www",
            "plugins": {
              "FirebaseAuthentication": {
                "providers": ["google.com"]
              }
            }
          }
          EOF

      - name: Add Android
        run: npx cap add android

      - name: Add Firebase config
        run: |
          mkdir -p android/app
          if [ -f "google-services (1).json" ]; then
            cp "google-services (1).json" android/app/google-services.json
          elif [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          else
            echo "google-services.json not found"
            exit 1
          fi

      - name: Configure Firebase plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/variables.gradle")
          text = p.read_text()

          if "rgcfaIncludeGoogle" not in text:
              text += "\nrgcfaIncludeGoogle = true\n"

          if "androidxCredentialsVersion" not in text:
              text += "\nandroidxCredentialsVersion = '1.3.0'\n"

          p.write_text(text)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Force compile SDK 36
        run: |
          cat > force-compile-sdk.gradle <<'EOF'
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android.compileSdkVersion 36
                      println("FORCED compileSdk = 36 for ${project.path}")
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --init-script ../force-compile-sdk.gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TDX-ESPORTS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
