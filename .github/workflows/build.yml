name: Build TDX ESPORTS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # 3. Node 22
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      # 4. Create package.json
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "tdx-esports",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "8.5.1",
              "@capacitor/android": "8.5.1",
              "@capacitor/firebase": "8.5.1",
              "@capacitor-firebase/authentication": "8.5.1",
              "firebase": "12.19.0"
            },
            "devDependencies": {
              "@capacitor/cli": "8.5.1",
              "@capacitor/assets": "3.0.5"
            }
          }
          EOF


      # 5. Install dependencies
      - name: Install dependencies
        run: |
          npm install


      # 6. Prepare Web Assets
      - name: Prepare web assets
        run: |
          mkdir -p www

          cp admin-login.html www/
          cp admin.html www/
          cp create-tournament.html www/
          cp home.html www/
          cp join.html www/
          cp leaderboard.html www/
          cp login.html www/
          cp manage-admins.html www/
          cp manage-results.html www/
          cp manage-teams.html www/
          cp owner.html www/
          cp profile.html www/
          cp results.html www/
          cp splash.html www/
          cp team.html www/
          cp tournament-details.html www/
          cp tournaments.html www/
          cp match-room.html www/
          cp manage-room.html

          if [ -f "app-logo.png" ]; then
            cp app-logo.png www/app-logo.png
            echo "TDX logo copied successfully"
          else
            echo "ERROR: app-logo.png not found in repository root"
            exit 1
          fi

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>TDX ESPORTS</title>
          </head>

          <body>
            <script>
              window.location.href = "splash.html";
            </script>
          </body>
          </html>
          EOF

          echo "Web assets ready"
          ls -la www


      # 7. Setup Capacitor
      - name: Setup Capacitor
        run: |
          npx cap init "TDX ESPORTS" "com.tdx.esports" --web-dir www
          npx cap add android


      # 8. Prepare App Icon
      - name: Prepare TDX App Icon
        run: |
          if [ ! -f "app-logo.png" ]; then
            echo "ERROR: app-logo.png not found"
            exit 1
          fi

          mkdir -p assets

          cp app-logo.png assets/icon.png

          echo "TDX ESPORTS icon prepared"
          ls -lh assets/icon.png


      # 9. Generate Android Launcher Icon
      - name: Generate Android App Icon
        run: |
          npx @capacitor/assets generate --android

          echo "Android launcher icon generated"


      # 10. Firebase Config
      - name: Add Firebase config
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "Firebase config copied"
          else
            echo "ERROR: google-services.json not found"
            exit 1
          fi


      # 11. Firebase Authentication Config
      - name: Configure Firebase Authentication
        run: |
          node <<'NODE'
          const fs = require('fs');

          const file = 'capacitor.config.json';

          const config = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          config.plugins = {
            FirebaseAuthentication: {
              providers: [
                'google.com'
              ]
            }
          };

          fs.writeFileSync(
            file,
            JSON.stringify(config, null, 2)
          );

          console.log(
            'Firebase Authentication configured'
          );
          NODE

          cat capacitor.config.json


      # 12. Firebase Android Configuration
      - name: Configure Firebase Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/variables.gradle")

          text = p.read_text()

          if "rgcfaIncludeGoogle" not in text:
              text = text.replace(
                  "ext {",
                  "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'",
                  1
              )

          p.write_text(text)

          print("Firebase Android configuration updated")
          PY

          cat android/variables.gradle


      # 13. Google Services
      - name: Configure Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/build.gradle")

          text = p.read_text()

          if "com.google.gms:google-services" not in text:
              text = text.replace(
                  "dependencies {",
                  "dependencies {\n        classpath 'com.google.gms:google-services:4.4.4'",
                  1
              )

          p.write_text(text)

          print("Google Services configured")
          PY

          cat android/build.gradle


      # 14. Apply Google Services Plugin
      - name: Apply Google Services plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")

          text = p.read_text()

          if "com.google.gms.google-services" not in text:
              text += "\n\napply plugin: 'com.google.gms.google-services'\n"

          p.write_text(text)

          print("Google Services plugin applied")
          PY

          tail -30 android/app/build.gradle


      # 15. Sync Capacitor
      - name: Sync Capacitor
        run: |
          npx cap sync android


      # 16. Force Compile SDK 36
      - name: Force compile SDK 36
        run: |
          cat > force-compile-sdk.init.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF


      # 17. Build APK
      - name: Build APK
        run: |
          cd android

          chmod +x gradlew

          ./gradlew assembleDebug \
            --init-script ../force-compile-sdk.init.gradle \
            --no-daemon


      # 18. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TDX-ESPORTS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
