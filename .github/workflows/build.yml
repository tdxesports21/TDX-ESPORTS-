name: Build TDX ESPORTS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "tdx-esports",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "8.5.1",
              "@capacitor/android": "8.5.1",
              "@capacitor-firebase/authentication": "8.5.1",
              "firebase": "12.19.0"
            },
            "devDependencies": {
              "@capacitor/cli": "8.5.1"
            }
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp ./*.html ./www/
          test -f ./www/index.html
          echo "Web assets ready"

      - name: Setup Capacitor
        run: |
          npx cap init "TDX ESPORTS" "com.tdx.esports" --web-dir www
          npx cap add android

      - name: Add Firebase config
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Configure Firebase Authentication
        run: |
          node -e "
          const fs=require('fs');
          const p='capacitor.config.json';
          let c=JSON.parse(fs.readFileSync(p));
          c.plugins={
            FirebaseAuthentication:{
              providers:['google.com']
            }
          };
          fs.writeFileSync(p,JSON.stringify(c,null,2));
          "

      - name: Configure Firebase Android variables
        run: |
          cat >> android/variables.gradle <<'EOF'

          ext {
              rgcfaIncludeGoogle = true
              androidxCredentialsVersion = '1.3.0'
          }
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Force compile SDK 36
        run: |
          cat > force-compile-sdk.init.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug \
            --init-script ../force-compile-sdk.init.gradle \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TDX-ESPORTS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
