<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Room - TDX ESPORTS</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#050b18;
 color:white;
 font-family:Arial,sans-serif;
}

.header{
 padding:20px;
 border-bottom:1px solid #12304d;
}

.logo{
 color:#00d9ff;
 font-size:24px;
 font-weight:900;
}

.container{
 padding:20px;
}

.card{
 background:#0b1628;
 border:1px solid #123653;
 border-radius:18px;
 padding:20px;
 margin-bottom:16px;
}

.title{
 font-size:22px;
 font-weight:800;
}

.sub{
 color:#8da5bd;
 font-size:13px;
 margin-top:6px;
}

.info{
 display:flex;
 justify-content:space-between;
 margin-top:18px;
 padding:14px;
 background:#07101f;
 border-radius:12px;
}

.info span:first-child{
 color:#8da5bd;
}

.value{
 color:#00d9ff;
 font-weight:800;
}

.room{
 margin-top:18px;
}

.roombox{
 margin-top:10px;
 padding:16px;
 background:#07101f;
 border:1px solid #1b4663;
 border-radius:12px;
}

.roomlabel{
 color:#8da5bd;
 font-size:12px;
}

.roomvalue{
 margin-top:5px;
 font-size:21px;
 font-weight:900;
 letter-spacing:2px;
}

.copy{
 margin-top:10px;
 padding:9px 14px;
 border:0;
 border-radius:8px;
 background:#123653;
 color:#00d9ff;
 font-weight:700;
}

.team{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:13px 0;
 border-bottom:1px solid #15304a;
}

.team:last-child{
 border-bottom:0;
}

.teamname{
 font-weight:700;
}

.status{
 color:#35e68b;
 font-size:12px;
}

button.main{
 width:100%;
 padding:15px;
 border:0;
 border-radius:12px;
 background:#00d9ff;
 color:#001018;
 font-size:16px;
 font-weight:900;
 margin-top:5px;
}

.back{
 display:block;
 text-align:center;
 margin-top:18px;
 color:#00d9ff;
 text-decoration:none;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">TDX ESPORTS</div>
</div>

<div class="container">

<div class="card">
  <div class="title">MATCH ROOM</div>
  <div class="sub">Your tournament room details</div>

  <div class="info">
    <span>Tournament</span>
    <span class="value">TDX CHAMPIONSHIP S1</span>
  </div>

  <div class="info">
    <span>Map</span>
    <span class="value">ERANGEL</span>
  </div>

  <div class="info">
    <span>Mode</span>
    <span class="value">SQUAD</span>
  </div>
</div>

<div class="card">

  <div class="title">ROOM DETAILS</div>

  <div class="room">
    <div class="roombox">
      <div class="roomlabel">ROOM ID</div>
      <div class="roomvalue" id="roomId">12345678</div>
      <button class="copy" onclick="copyRoom()">COPY ROOM ID</button>
    </div>
  </div>

  <div class="room">
    <div class="roombox">
      <div class="roomlabel">PASSWORD</div>
      <div class="roomvalue" id="roomPassword">TDX2026</div>
      <button class="copy" onclick="copyPassword()">COPY PASSWORD</button>
    </div>
  </div>

</div>

<div class="card">

  <div class="title">MY TEAM</div>

  <div class="team">
    <div class="teamname" id="myTeam">DOMIN ESPORTS</div>
    <div class="status">JOINED</div>
  </div>

  <div class="team">
    <div id="player">Player</div>
    <div class="status">READY</div>
  </div>

</div>

<button class="main" onclick="openProfile()">
  VIEW PROFILE
</button>

<a class="back" href="home.html">← Back to Home</a>

</div>

<script>

const joinData =
 JSON.parse(localStorage.getItem("tdx_join_data") || "{}");

if(joinData.teamName){
 document.getElementById("myTeam").innerText =
 joinData.teamName;
}

if(joinData.playerName){
 document.getElementById("player").innerText =
 joinData.playerName;
}

function copyRoom(){

 const text =
 document.getElementById("roomId").innerText;

 navigator.clipboard.writeText(text);

 alert("Room ID copied!");
}

function copyPassword(){

 const text =
 document.getElementById("roomPassword").innerText;

 navigator.clipboard.writeText(text);

 alert("Password copied!");
}

function openProfile(){
 window.location.href="profile.html";
}

</script>

</body>
</html>
