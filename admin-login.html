<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDX ESPORTS - Admin Login</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#020817;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:390px;
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:900;
  letter-spacing:3px;
  margin-bottom:8px;
  text-shadow:0 0 15px #00c8ff;
}

.logo span{
  color:#00c8ff;
}

.subtitle{
  text-align:center;
  color:#71899c;
  font-size:12px;
  margin-bottom:25px;
}

.card{
  background:linear-gradient(145deg,#071c30,#04101e);
  border:1px solid #12364e;
  border-radius:20px;
  padding:22px;
  box-shadow:0 10px 35px rgba(0,0,0,.35);
}

.card h1{
  text-align:center;
  font-size:21px;
  margin-bottom:22px;
}

label{
  display:block;
  color:#9ab0c0;
  font-size:12px;
  margin-bottom:7px;
}

input{
  width:100%;
  height:46px;
  padding:0 13px;
  margin-bottom:16px;
  background:#061426;
  border:1px solid #163b53;
  border-radius:9px;
  outline:none;
  color:white;
  font-size:13px;
}

input:focus{
  border-color:#00c8ff;
  box-shadow:0 0 8px rgba(0,200,255,.15);
}

.login-btn{
  width:100%;
  height:47px;
  border:0;
  border-radius:10px;
  background:#00c8ff;
  color:#00111c;
  font-weight:900;
  font-size:14px;
}

.message{
  min-height:18px;
  text-align:center;
  margin-top:13px;
  font-size:12px;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#00c8ff;
  text-decoration:none;
  font-size:12px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    TDX <span>ESPORTS</span>
  </div>

  <div class="subtitle">
    ADMIN CONTROL PANEL
  </div>

  <div class="card">

    <h1>Admin Login</h1>

    <label>Admin Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter admin email"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter password"
    >

    <button class="login-btn" onclick="adminLogin()">
      LOGIN AS ADMIN
    </button>

    <div class="message" id="message"></div>

  </div>

  <a href="login.html" class="back">
    ← Back to Player Login
  </a>

</div>

<script>
function adminLogin(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");

  if(!email || !password){

    message.style.color = "#ff6b6b";
    message.textContent =
      "Please enter email and password.";

    return;
  }

  /*
    Demo UI only.
    Real Firebase Admin authentication
    will be connected later.
  */

  message.style.color = "#58d68d";
  message.textContent =
    "Login details submitted.";
}
</script>

</body>
</html>
